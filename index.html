<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte Speciali Calcio</title>

<style>

body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h1{
    font-size:2rem;
    margin-bottom:10px;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:black;
    color:white;
    margin-bottom:20px;
}

button:hover{
    background:#333;
}

#cardName{
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
}

#cardContainer{
    margin-top:20px;
}

img{
    max-width:90%;
    max-height:65vh;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
}

#timer{
    font-size:60px;
    font-weight:bold;
    margin-top:20px;
    color:#d62828;
}

#cardsLeft{
    margin-top:10px;
    font-size:18px;
    color:#555;
}

</style>

</head>

<body>

<h1>🃏 Carte Speciali Calcio</h1>

<button onclick="drawCard()">PESCA CARTA</button>

<h2 id="cardName">Premi "PESCA CARTA"</h2>

<div id="cardContainer">
    <img src="retro.jpg" alt="Retro Carta">
</div>

<div id="timer"></div>

<div id="cardsLeft"></div>

<audio id="alarm">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<script>

const cards = [

{name:"Rigore assegnato", image:"carta/1.jpg", time:120},
{name:"Prossimo gol vale doppio", image:"carta/2.jpg", time:120},
{name:"Gol capitano vale doppio", image:"carta/3.jpg", time:120},
{name:"Tutti i gol valgono doppio (1 minuto)", image:"carta/4.jpg", time:60},
{name:"Un uomo in meno", image:"carta/5.jpg", time:60},
{name:"Portiere senza mani", image:"carta/6.jpg", time:120},
{name:"Retropassaggio vietato", image:"carta/7.jpg", time:120},
{name:"Vietato segnare da fuori area", image:"carta/8.jpg", time:120},
{name:"Tutti i gol valgono doppio (2 minuti)", image:"carta/9.jpg", time:120},
{name:"Rigore inverso", image:"carta/10.jpg", time:120},
{name:"Gol del portiere vale triplo", image:"carta/11.jpg", time:120},
{name:"Tutti portieri", image:"carta/12.jpg", time:120},
{name:"Primo gol vale doppio", image:"carta/13.jpg", time:120},
{name:"Si gioca 2v2", image:"carta/14.jpg", time:120},
{name:"Gol di testa vale doppio", image:"carta/15.jpg", time:120}

];

let deck = [...cards];
let interval;

updateDeckCounter();

function drawCard(){

if(deck.length===0){

deck = [...cards];

alert("🔄 Mazzo rimescolato!");

}

const index = Math.floor(Math.random() * deck.length);

const card = deck.splice(index,1)[0];

document.getElementById("cardName").innerHTML = card.name;

document.getElementById("cardContainer").innerHTML =
`<img src="${card.image}" alt="${card.name}">`;

updateDeckCounter();

startTimer(card.time);

}

function startTimer(seconds){

clearInterval(interval);

let time = seconds;

update();

interval = setInterval(()=>{

time--;

update();

if(time <= 0){

clearInterval(interval);

document.getElementById("timer").innerHTML =
"✅ EFFETTO TERMINATO";

document.getElementById("alarm").play();

}

},1000);

function update(){

let m = Math.floor(time/60);
let s = time%60;

document.getElementById("timer").innerHTML =
`${m}:${s.toString().padStart(2,"0")}`;

}

}

function updateDeckCounter(){

document.getElementById("cardsLeft").innerHTML =
`Carte rimanenti nel mazzo: ${deck.length}`;

}

</script>

</body>
</html>
